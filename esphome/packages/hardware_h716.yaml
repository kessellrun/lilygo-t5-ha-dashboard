# ==============================================================================
# Hardware Package: LilyGo T5 4.7-inch E-Paper Touch Non-Soldered Female Pin [H716]
# ==============================================================================
# Board Specifications:
# - MCU           : ESP32-S3-WROOM-1-N16R8 (Dual-Core LX7 @ 240MHz)
# - Flash / PSRAM : 16MB Quad SPI Flash + 8MB Octal PSRAM (80MHz)
# - E-Paper Panel : ED047TC1 4.7" 960x540 16-Level Grayscale (8-bit Parallel Bus)
# - Shared I2C    : SDA = GPIO18, SCL = GPIO17 (400kHz Fast Mode)
# - Touch Sensor  : Goodix GT911 Capacitive Touch (I2C 0x5D / 0x14, INT = GPIO47)
# - RealTimeClock : NXP PCF8563 RTC (I2C 0x51)
# - Wake Button   : GPIO21 (RTC_GPIO21 physical side button for Deep Sleep wake)
# - Battery Sense : GPIO14 ADC1_CH3 (Internal 100k/100k 2:1 Voltage Divider)
# ==============================================================================

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

# ==============================================================================
# External Display Component for ESP32-S3 + ED047TC1 Parallel E-Paper
# Primary community driver: github://hbast/lilygo_t5_47_plus
# Fallback alternative   : github://nickolay/esphome-lilygo-t547plus@main
# ==============================================================================
external_components:
  - source:
      type: git
      url: https://github.com/hbast/lilygo_t5_47_plus
      ref: main
    components: [lilygo_t5_47_plus]

  # Fallback option (uncomment below and comment out above if needed):
  # - source: github://nickolay/esphome-lilygo-t547plus@main
  #   components: [t547]

# ==============================================================================
# Shared Onboard + 40-Pin Female Header I2C Bus (GPIO18 SDA / GPIO17 SCL)
# Connects GT911 Touch, PCF8563 RTC, and optional external female-header sensors
# ==============================================================================
i2c:
  - id: i2c_bus
    sda: GPIO18
    scl: GPIO17
    frequency: 400kHz
    scan: true

# ==============================================================================
# Dual Time Sources: Onboard PCF8563 Hardware RTC + Home Assistant Network Sync
# Provides instant wall-clock time on Deep Sleep wake before Wi-Fi connects!
# ==============================================================================
time:
  - platform: pcf8563
    id: rtc_time
    i2c_id: i2c_bus
    address: 0x51
    update_interval: 15min

  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf8563.write_time:
            id: rtc_time
        - logger.log: "Synchronized Home Assistant network time to onboard PCF8563 RTC"
    on_time:
      # Evaluate power state and refresh clock every minute while awake
      - seconds: 0
        minutes: /1
        then:
          - script.execute: request_screen_refresh
          - script.execute: evaluate_power_state

# ==============================================================================
# Goodix GT911 Capacitive Touchscreen Controller (via lilygo_t5_47_plus driver)
# Uses `swap_xy: true` and `mirror_y: true` to align the portrait GT911 sensor
# with the 960x540 landscape ED047TC1 display.
# ==============================================================================
touchscreen:
  - platform: lilygo_t5_47_plus
    id: gt911_touch
    i2c_id: i2c_bus
    display: epaper_display
    update_interval: 100ms
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            id(last_touch_ms) = millis();
            id(last_touch_x) = touch.x;
            id(last_touch_y) = touch.y;
            if (id(rtc_time).now().is_valid()) {
              id(last_touch_epoch) = id(rtc_time).now().timestamp;
            }
        - logger.log:
            format: "GT911 Touch detected at X=%d, Y=%d — resetting inactivity timer"
            args: ['touch.x', 'touch.y']

# ==============================================================================
