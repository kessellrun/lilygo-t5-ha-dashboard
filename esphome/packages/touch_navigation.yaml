# ==============================================================================
# GT911 Capacitive Touch Hitboxes & Contextual Navigation (960 x 540 Landscape)
# ==============================================================================
# Every hitbox satisfies: 0 <= x_min < x_max <= 960 and 0 <= y_min < y_max <= 540
#
# Coordinate Architecture:
#   - Top Status Header Quick Buttons : y = 0..56
#   - Main Contextual 2x3 Touch Grid  : y = 75..435
#       Col 1: x = 20..310 | Col 2: x = 335..625 | Col 3: x = 650..940
#       Row 1: y = 75..245 | Row 2: y = 265..435
#   - Bottom 4-Tab Navigation Bar     : y = 476..540
#       Tab 0: x = 0..239  | Tab 1: x = 240..479 | Tab 2: x = 480..719 | Tab 3: x = 720..959
# ==============================================================================

binary_sensor:
  # ============================================================================
  # 1. Bottom 4-Tab Navigation Bar (y: 476..540)
  # ============================================================================
  - platform: touchscreen
    id: touch_tab_0
    name: "Touch Tab 0 (Controls)"
    touchscreen_id: gt911_touch
    x_min: 0
    x_max: 239
    y_min: 476
    y_max: 540
    on_press:
      then:
        - lambda: |-
            id(active_tab) = 0;
            id(last_touch_ms) = millis();
        - script.execute: request_screen_refresh

  - platform: touchscreen
    id: touch_tab_1
    name: "Touch Tab 1 (Weather)"
    touchscreen_id: gt911_touch
    x_min: 240
    x_max: 479
    y_min: 476
    y_max: 540
    on_press:
      then:
        - lambda: |-
            id(active_tab) = 1;
            id(last_touch_ms) = millis();
        - script.execute: request_screen_refresh

  - platform: touchscreen
    id: touch_tab_2
    name: "Touch Tab 2 (Indoor Climate)"
    touchscreen_id: gt911_touch
    x_min: 480
    x_max: 719
    y_min: 476
    y_max: 540
    on_press:
      then:
        - lambda: |-
            id(active_tab) = 2;
            id(last_touch_ms) = millis();
        - script.execute: request_screen_refresh

  - platform: touchscreen
    id: touch_tab_3
    name: "Touch Tab 3 (LiPo & Power)"
    touchscreen_id: gt911_touch
    x_min: 720
    x_max: 959
    y_min: 476
    y_max: 540
    on_press:
      then:
        - lambda: |-
            id(active_tab) = 3;
            id(last_touch_ms) = millis();
        - script.execute: request_screen_refresh

  # ============================================================================
  # 2. Top Header Action Buttons (y: 0..56)
  # ============================================================================
  - platform: touchscreen
    id: touch_hdr_refresh
    name: "Header Full Refresh Button"
    touchscreen_id: gt911_touch
    x_min: 740
    x_max: 845
    y_min: 0
    y_max: 56
    on_press:
      then:
        - lambda: |-
            id(last_touch_ms) = millis();
        - script.execute: trigger_full_clean_refresh

  - platform: touchscreen
    id: touch_hdr_sleep
    name: "Header Power Mode and Sleep Button"
    touchscreen_id: gt911_touch
    x_min: 846
    x_max: 955
    y_min: 0
    y_max: 56
    on_press:
      then:
        - lambda: |-
            id(last_touch_ms) = millis();
            id(power_mode_index) = (id(power_mode_index) + 1) % 3;
        - script.execute: request_screen_refresh

  # ============================================================================
  # 3. Main Body Contextual 2x3 Grid Touch Zones (y: 75..435)
  # ============================================================================

  # --- Grid Zone 1: Row 1, Col 1 (x: 20..310, y: 75..245) ---
  - platform: touchscreen
    id: touch_grid_1
    name: "Touch Grid Zone 1 (R1C1)"
    touchscreen_id: gt911_touch
    x_min: 20
    x_max: 310
    y_min: 75
    y_max: 245
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 0;'
            then:
              - lambda: 'id(ctrl_1_state) = !id(ctrl_1_state);'
              - homeassistant.service:
                  service: homeassistant.turn_on
                  data:
                    entity_id: ${entity_ctrl_1}
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 3;'
            then:
              - lambda: 'id(power_mode_index) = 0;'
              - homeassistant.service:
                  service: input_select.select_option
                  data:
                    entity_id: ${entity_power_profile}
                    option: "Always Online (Modem Sleep)"
              - script.execute: request_screen_refresh

  # --- Grid Zone 2: Row 1, Col 2 (x: 335..625, y: 75..245) ---
  - platform: touchscreen
    id: touch_grid_2
    name: "Touch Grid Zone 2 (R1C2)"
    touchscreen_id: gt911_touch
    x_min: 335
    x_max: 625
    y_min: 75
    y_max: 245
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 0;'
            then:
              - lambda: 'id(ctrl_2_state) = !id(ctrl_2_state);'
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: ${entity_ctrl_2}
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 3;'
            then:
              - lambda: 'id(power_mode_index) = 1;'
              - homeassistant.service:
                  service: input_select.select_option
                  data:
                    entity_id: ${entity_power_profile}
                    option: "Adaptive Hybrid (Recommended)"
              - script.execute: request_screen_refresh

  # --- Grid Zone 3: Row 1, Col 3 (x: 650..940, y: 75..245) ---
  - platform: touchscreen
    id: touch_grid_3
    name: "Touch Grid Zone 3 (R1C3)"
    touchscreen_id: gt911_touch
    x_min: 650
    x_max: 940
    y_min: 75
    y_max: 245
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 0;'
            then:
              - lambda: 'id(ctrl_3_state) = !id(ctrl_3_state);'
              - homeassistant.service:
                  service: homeassistant.turn_on
                  data:
                    entity_id: ${entity_ctrl_3}
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 2;'
            then:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: ${entity_hvac}
                  data_template:
                    temperature: !lambda |-
                      float cur = id(ha_hvac_target_temp).state;
                      if (isnan(cur)) cur = 70.0f;
                      return cur + 1.0f;
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 3;'
            then:
              - lambda: 'id(power_mode_index) = 2;'
              - homeassistant.service:
                  service: input_select.select_option
                  data:
                    entity_id: ${entity_power_profile}
                    option: "Max Battery (Deep Sleep + Touch Wake)"
              - script.execute: request_screen_refresh

  # --- Grid Zone 4: Row 2, Col 1 (x: 20..310, y: 265..435) ---
  - platform: touchscreen
    id: touch_grid_4
    name: "Touch Grid Zone 4 (R2C1)"
    touchscreen_id: gt911_touch
    x_min: 20
    x_max: 310
    y_min: 265
    y_max: 435
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 0;'
            then:
              - lambda: 'id(ctrl_4_state) = !id(ctrl_4_state);'
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: ${entity_ctrl_4}
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 3;'
            then:
              - script.execute: trigger_full_clean_refresh

  # --- Grid Zone 5: Row 2, Col 2 (x: 335..625, y: 265..435) ---
  - platform: touchscreen
    id: touch_grid_5
    name: "Touch Grid Zone 5 (R2C2)"
    touchscreen_id: gt911_touch
    x_min: 335
    x_max: 625
    y_min: 265
    y_max: 435
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 0;'
            then:
              - lambda: 'id(ctrl_5_state) = !id(ctrl_5_state);'
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: ${entity_ctrl_5}
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 3;'
            then:
              - homeassistant.service:
                  service: input_boolean.toggle
                  data:
                    entity_id: ${entity_stay_awake_ota}
              - script.execute: request_screen_refresh

  # --- Grid Zone 6: Row 2, Col 3 (x: 650..940, y: 265..435) ---
  - platform: touchscreen
    id: touch_grid_6
    name: "Touch Grid Zone 6 (R2C3)"
    touchscreen_id: gt911_touch
    x_min: 650
    x_max: 940
    y_min: 265
    y_max: 435
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 0;'
            then:
              - lambda: 'id(ctrl_6_state) = !id(ctrl_6_state);'
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: ${entity_ctrl_6}
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 2;'
            then:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: ${entity_hvac}
                  data_template:
                    temperature: !lambda |-
                      float cur = id(ha_hvac_target_temp).state;
                      if (isnan(cur)) cur = 70.0f;
                      return cur - 1.0f;
              - script.execute: request_screen_refresh
        - if:
            condition:
              lambda: 'return id(active_tab) == 3;'
            then:
              - script.execute: enter_touch_armed_deep_sleep

  # ============================================================================
  # 4. Dedicated Tab 2 Thermostat Setpoint [-1] / [+1] Buttons
  # ============================================================================
  - platform: touchscreen
    id: touch_hvac_minus
    name: "Touch HVAC Target Temp Minus"
    touchscreen_id: gt911_touch
    x_min: 625
    x_max: 710
    y_min: 295
    y_max: 355
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 2;'
            then:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: ${entity_hvac}
                  data_template:
                    temperature: !lambda |-
                      float cur = id(ha_hvac_target_temp).state;
                      if (isnan(cur)) cur = 70.0f;
                      return cur - 1.0f;
              - script.execute: request_screen_refresh

  - platform: touchscreen
    id: touch_hvac_plus
    name: "Touch HVAC Target Temp Plus"
    touchscreen_id: gt911_touch
    x_min: 830
    x_max: 915
    y_min: 295
    y_max: 355
    on_press:
      then:
        - lambda: 'id(last_touch_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(active_tab) == 2;'
            then:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: ${entity_hvac}
                  data_template:
                    temperature: !lambda |-
                      float cur = id(ha_hvac_target_temp).state;
                      if (isnan(cur)) cur = 70.0f;
                      return cur + 1.0f;
              - script.execute: request_screen_refresh
