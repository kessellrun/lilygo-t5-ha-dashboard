# ==============================================================================
# 1S LiPo Battery Sensing & Adaptive Hybrid Power State Machine
# ==============================================================================
# The LilyGo T5 4.7" [H716] routes the 2-pin JST 2.0mm PH LiPo battery connector
# through an internal 100k/100k (2:1) resistor divider to ESP32-S3 GPIO14.
#
# Three Selectable Power Profiles:
#   0 = ALWAYS ONLINE (Modem Sleep) : Instant HA push updates (~18mA avg)
#   1 = ADAPTIVE HYBRID (Default)   : Modem Sleep during daytime when SoC > 35%;
#                                     Touch-Armed Deep Sleep during Quiet Hours
#                                     (23:00-06:00) or when SoC <= 35% (~1.2mA)
#   2 = MAX BATTERY (Deep Sleep)    : Wakes every 15m via PCF8563/Timer OR
#                                     instantly on GT911 GPIO16 screen touch!
# ==============================================================================

wifi:
  id: wifi_client
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT
  manual_ip:
    # Per-device static IP via substitution (defaults to !secret static_ip)
    static_ip: ${static_ip}
    gateway: !secret gateway_ip
    subnet: !secret subnet_mask
    dns1: !secret dns_ip

# ==============================================================================
# ESP32-S3 Deep Sleep Controller with Onboard Wake Button (GPIO21 / RTC_GPIO21)
# ==============================================================================
deep_sleep:
  id: deep_sleep_ctrl
  sleep_duration: 15min
  wakeup_pin:
    number: GPIO21
    inverted: true
    allow_other_uses: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: IGNORE

# ==============================================================================
# RTC-Backed Globals (Persisted across Deep Sleep Wake Cycles)
# ==============================================================================
globals:
  # Current active tab (0=Controls, 1=Weather, 2=Climate, 3=LiPo & Diagnostics)
  - id: active_tab
    type: int
    restore_value: true
    initial_value: '0'

  # Cumulative partial refresh counter (triggers full ghost-clear every 10 updates)
  - id: refresh_counter
    type: int
    restore_value: true
    initial_value: '0'

  # Active power profile: 0 = Always Online, 1 = Adaptive Hybrid, 2 = Max Battery
  - id: power_mode_index
    type: int
    restore_value: true
    initial_value: '1'

  # Epoch timestamp of most recent GT911 touch event
  - id: last_touch_epoch
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Millis timestamp of most recent GT911 touch event
  - id: last_touch_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last transformed touch X/Y coordinates (for on-screen feedback)
  - id: last_touch_x
    type: int
    restore_value: false
    initial_value: '-1'

  - id: last_touch_y
    type: int
    restore_value: false
    initial_value: '-1'

  # Local/optimistic toggle states for Tab 0 Control Cards (1..6)
  # Synced with Home Assistant entities when connected, and toggled immediately
  # on screen tap so buttons respond visually even before HA entities are mapped.
  - id: ctrl_1_state
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: ctrl_2_state
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: ctrl_3_state
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: ctrl_4_state
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: ctrl_5_state
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: ctrl_6_state
    type: bool
    restore_value: true
    initial_value: 'false'

  # Previous ADC sample voltage for positive dV/dt charging detection
  - id: prev_lipo_voltage
    type: float
    restore_value: true
    initial_value: '3.95'

  # Latched charging heuristic state updated on each ADC filter output
  - id: is_charging_state
    type: bool
    restore_value: true
    initial_value: 'false'

  # True when current wake session originated from 15m timer without user touch
  - id: is_timer_wake
    type: bool
    restore_value: false
    initial_value: 'true'

  # True when booted via physical RST button or USB power (gives 120s OTA grace window)
  - id: is_cold_boot
    type: bool
    restore_value: false
    initial_value: 'false'

  # True while an ESPHome wireless OTA firmware upload is actively in progress
  - id: ota_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'

  # Tracks whether the E-Paper display has already been refreshed this session
  - id: session_refreshed
    type: bool
    restore_value: false
    initial_value: 'false'

  # True right before entering Deep Sleep so the UI renders the sleep/wake prompt
  - id: is_going_to_sleep
    type: bool
    restore_value: false
    initial_value: 'false'

  # PCF8563 RTC-backed cumulative elapsed time (seconds) spent in each power mode
  # Persisted across Deep Sleep cycles; resets when a new USB-C charge cycle completes.
  - id: mode_0_sec
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: mode_1_sec
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: mode_2_sec
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: last_mode_epoch
    type: uint32_t
    restore_value: true
    initial_value: '0'

# ==============================================================================
# 1S LiPo Voltage ADC (GPIO14) & 11-Point Non-Linear Discharge Curve Lookup
# ==============================================================================
sensor:
  - platform: adc
    pin: GPIO14
    id: lipo_voltage
    name: "LiPo Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            float v = x;
            if (!isnan(v) && v > 2.0f) {
              float dv = v - id(prev_lipo_voltage);
              id(is_charging_state) = (v > 4.21f) || (dv >= 0.025f && v > 3.85f);
              id(prev_lipo_voltage) = v;
            }
        - component.update: lipo_battery_level
        - script.execute: evaluate_power_state

  - platform: template
    id: lipo_battery_level
    name: "LiPo Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(lipo_voltage).state;
      if (isnan(v) || v <= 0.1f) return 0.0f;

      // 11-Point Piecewise Linear 1S LiPo Discharge Curve (3.30V = 0% .. 4.20V = 100%)
      struct CurvePoint { float volt; float pct; };
      static const CurvePoint kCurve[11] = {
        {4.20f, 100.0f},
        {4.06f,  90.0f},
        {3.98f,  80.0f},
        {3.92f,  70.0f},
        {3.87f,  60.0f},
        {3.82f,  50.0f},
        {3.79f,  40.0f},
        {3.75f,  30.0f},
        {3.70f,  20.0f},
        {3.61f,  10.0f},
        {3.30f,   0.0f}
      };

      if (v >= kCurve[0].volt) return 100.0f;
      if (v <= kCurve[10].volt) return 0.0f;

      for (int i = 0; i < 10; i++) {
        if (v <= kCurve[i].volt && v >= kCurve[i + 1].volt) {
          float span_v = kCurve[i].volt - kCurve[i + 1].volt;
          float ratio = (v - kCurve[i + 1].volt) / span_v;
          return kCurve[i + 1].pct + ratio * (kCurve[i].pct - kCurve[i + 1].pct);
        }
      }
      return 0.0f;

# ==============================================================================
# LiPo USB-C Charging Heuristic Binary Sensor
# ==============================================================================
binary_sensor:
  - platform: template
    id: lipo_charging
    name: "LiPo Battery Charging"
    device_class: battery_charging
    lambda: |-
      return id(is_charging_state);

# ==============================================================================
# Periodic Power State Evaluation Interval (5s)
# ==============================================================================
interval:
  - interval: 5s
    then:
      - script.execute: evaluate_power_state

# ==============================================================================
# Power Management & E-Paper Refresh Scripts
# ==============================================================================
script:
  - id: request_screen_refresh
    mode: restart
    then:
      - delay: 300ms
      - lambda: |-
          id(refresh_counter) += 1;
          id(session_refreshed) = true;
      - component.update: epaper_display

  - id: trigger_full_clean_refresh
    mode: single
    then:
      - logger.log: "Triggering full black-white-clear anti-ghosting E-Paper cycle"
      - lambda: |-
          id(refresh_counter) = 0;
          id(session_refreshed) = true;
      - component.update: epaper_display

  - id: enter_touch_armed_deep_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(ha_stay_awake_ota).state || id(ota_in_progress);'
          then:
            - logger.log: "OTA active or Stay-Awake lock is ON — skipping Deep Sleep"
          else:
            - logger.log: "Rendering sleep wake-hint overlay and entering Touch-Armed Deep Sleep (GPIO21 Wake + 15m Timer)"
            - lambda: 'id(is_going_to_sleep) = true;'
            - component.update: epaper_display
            - delay: 1000ms
            - lambda: |-
                gpio_set_direction(GPIO_NUM_21, GPIO_MODE_INPUT);
                gpio_set_pull_mode(GPIO_NUM_21, GPIO_PULLUP_ONLY);
                delay(5);
                if (gpio_get_level(GPIO_NUM_21) == 0) {
                  ESP_LOGW("power", "GPIO21 is LOW at sleep entry — arming HIGH-level wake on GPIO21 + 15m timer");
                  gpio_set_pull_mode(GPIO_NUM_21, GPIO_PULLDOWN_ONLY);
                  esp_sleep_enable_ext0_wakeup(GPIO_NUM_21, 1);
                  esp_sleep_enable_timer_wakeup(900ULL * 1000000ULL);
                  esp_deep_sleep_start();
                }
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: 15min

  - id: evaluate_power_state
    mode: single
    then:
      - lambda: |-
          float vbat = id(lipo_voltage).state;
          float soc  = id(lipo_battery_level).state;
          float v_crit = atof("${vbat_critical}");
          float soc_thresh = atof("${hybrid_sleep_soc_threshold}");

          // 0. Accrue real wall-clock elapsed time per power mode via PCF8563 RTC
          auto rtc_now = id(rtc_time).now();
          if (rtc_now.is_valid() && rtc_now.timestamp > 1700000000UL) {
            uint32_t cur_ep = (uint32_t)rtc_now.timestamp;
            if (id(last_mode_epoch) > 1700000000UL && cur_ep > id(last_mode_epoch)) {
              uint32_t dt = cur_ep - id(last_mode_epoch);
              if (dt <= 86400UL) {
                if (id(power_mode_index) == 0) id(mode_0_sec) += dt;
                else if (id(power_mode_index) == 1) id(mode_1_sec) += dt;
                else id(mode_2_sec) += dt;
              }
            }
            id(last_mode_epoch) = cur_ep;
          }

          // Reset per-mode discharge timers when battery is charged near full on USB-C
          if (id(is_charging_state) && !isnan(vbat) && vbat >= 4.15f) {
            id(mode_0_sec) = 0;
            id(mode_1_sec) = 0;
            id(mode_2_sec) = 0;
          }

          // 1. Critical Low-Battery Hardware Protection (< 3.32V)
          // Renders the Critical Hibernate lock screen and sleeps indefinitely
          if (!isnan(vbat) && vbat > 2.0f && vbat < v_crit && !id(lipo_charging).state) {
            ESP_LOGE("power", "CRITICAL LIPO VOLTAGE (%.2fV < %.2fV) — Hibernating to protect cell!", vbat, v_crit);
            id(epaper_display).update();
            id(deep_sleep_ctrl).set_sleep_duration(86400000UL); // 24h emergency cut-off
            id(deep_sleep_ctrl).begin_sleep(true);
            return;
          }

          // 2. Respect Active OTA Upload or Home Assistant OTA Stay-Awake Lock
          if (id(ota_in_progress) || id(ha_stay_awake_ota).state) {
            id(deep_sleep_ctrl).prevent_deep_sleep();
            return;
          }

          // 3. Mode 0: Always Online (Wi-Fi Modem Sleep) — Never enter Deep Sleep
          if (id(power_mode_index) == 0) {
            return;
          }

          // 4. Respect Awake Window:
          //    - Physical RST / Cold Boot: 120s grace window so ESPHome can compile & upload OTA
          //    - Untouched 15m timer wake: brief sync window (${timer_wake_sync_sec} = 12s)
          //    - Interactive touch/button wake: 30s in Max Battery (Mode 2), 90s in Adaptive Hybrid (Mode 1)
          if (id(is_cold_boot) && millis() < 120000UL) {
            return;
          }
          if (id(is_timer_wake)) {
            uint32_t sync_limit_ms = (uint32_t)(atoi("${timer_wake_sync_sec}")) * 1000UL;
            if (millis() < sync_limit_ms) {
              return;
            }
          } else {
            uint32_t idle_limit_ms = (id(power_mode_index) == 2)
                ? (uint32_t)(atoi("${max_battery_touch_timeout_sec}")) * 1000UL
                : (uint32_t)(atoi("${inactivity_timeout_sec}")) * 1000UL;
            uint32_t elapsed_ms = millis() - id(last_touch_ms);
            if (elapsed_ms < idle_limit_ms) {
              return;
            }
          }

          // 5. Mode 2: Max Battery — Enter Touch-Armed Deep Sleep as soon as idle/sync completes
          if (id(power_mode_index) == 2) {
            id(enter_touch_armed_deep_sleep).execute();
            return;
          }

          // 6. Mode 1: Adaptive Hybrid — Check Quiet Hours (23:00..06:00) & SoC Threshold
          bool in_quiet_hours = false;
          if (rtc_now.is_valid()) {
            int hr = rtc_now.hour;
            int q_start = !isnan(id(ha_quiet_start).state)
                ? (int)id(ha_quiet_start).state
                : atoi("${quiet_start_hour}");
            int q_end = !isnan(id(ha_quiet_end).state)
                ? (int)id(ha_quiet_end).state
                : atoi("${quiet_end_hour}");
            if (q_start > q_end) {
              in_quiet_hours = (hr >= q_start || hr < q_end);
            } else {
              in_quiet_hours = (hr >= q_start && hr < q_end);
            }
          }

          bool low_soc = (!isnan(soc) && soc <= soc_thresh && !id(lipo_charging).state);
          if (in_quiet_hours || low_soc) {
            id(enter_touch_armed_deep_sleep).execute();
          }
