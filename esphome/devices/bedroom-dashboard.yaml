# ==============================================================================
# Local ESPHome Stub for `/config/esphome/lilygo-t5-bedroom.yaml`
# ==============================================================================
# Paste just this file into `/config/esphome/lilygo-t5-bedroom.yaml` inside your
# Home Assistant ESPHome dashboard (same pattern as your Living Room device!).
#
# All Bedroom entities, labels, and shared Weather / Climate / Power tabs are
# pulled automatically from `esphome/bedroom_package.yaml` on GitHub on every
# build (`refresh: 0s`).
#
# Prerequisite in `/config/esphome/secrets.yaml`:
#   bedroom_static_ip: "192.168.1.xxx"
# ==============================================================================

packages:
  dashboard:
    url: https://github.com/kessellrun/lilygo-t5-ha-dashboard
    ref: main
    files: [esphome/bedroom_package.yaml]
    refresh: 0s
