# ==============================================================================
# Remote Git Package Entrypoint for LilyGo T5 4.7" [H716] Dashboard
# ==============================================================================
# Self-contained GitHub configuration: includes all substitutions, packages,
# fonts, and the complete 4-Tab 960x540 C++ UI renderer inline so stale local
# header files in `/config/esphome/include/` can never cause build conflicts!
# ==============================================================================

substitutions:
  device_name: "lilygo-t5-h716-dashboard"
  friendly_name: "LilyGo T5 4.7 E-Paper Dashboard"
  use_imperial: "true"
  temp_unit: "°F"
  speed_unit: "mph"
  use_12h_clock: "true"
  vbat_warn: "3.45"
  vbat_critical: "3.32"
  hybrid_sleep_soc_threshold: "35"
  inactivity_timeout_sec: "90"
  timer_wake_sync_sec: "12"
  max_battery_touch_timeout_sec: "30"
  quiet_start_hour: "23"
  quiet_end_hour: "6"

  # ----------------------------------------------------------------------------
  # Tab 0: Smart Home Touch Controls (2x3)
  # ----------------------------------------------------------------------------
  entity_ctrl_1: "scene.living_room_tv"
  label_ctrl_1: "Living Room TV"

  entity_ctrl_2: "light.kitchen_lights"
  label_ctrl_2: "Kitchen Lights"

  entity_ctrl_3: "scene.evening_lights"
  label_ctrl_3: "Evening Lights"

  entity_ctrl_4: "light.cync_indoor_light_strip_16ft_2"
  label_ctrl_4: "Bookshelf Lights"

  entity_ctrl_5: "switch.living_room_light"
  label_ctrl_5: "Wave Light"

  entity_ctrl_6: "scene.bed_time"
  label_ctrl_6: "Goodnight"

  entity_stay_awake_ota: "input_boolean.lilygo_t5_stay_awake_ota"
  entity_power_profile: "input_select.lilygo_t5_power_profile"
  entity_quiet_start: "input_number.lilygo_t5_quiet_hours_start"
  entity_quiet_end: "input_number.lilygo_t5_quiet_hours_end"

  # ----------------------------------------------------------------------------
  # Tab 1: Weather & 5-Day Forecast
  # ----------------------------------------------------------------------------
  entity_weather: "weather.forecast_home"
  entity_weather_forecast_csv: "sensor.lilygo_t5_weather_forecast_compact"

  # ----------------------------------------------------------------------------
  # Tab 2: Indoor Climate & HVAC Matrix
  # ----------------------------------------------------------------------------
  entity_room1_temp: "sensor.living_room_temperature"
  entity_room1_hum: "sensor.thermostat_current_humidity"
  label_room1: "Living Room"

  entity_room2_temp: "sensor.thermostat_current_temperature"
  entity_room2_hum: "sensor.thermostat_current_humidity"
  label_room2: "Hallway"

  entity_room3_temp: "sensor.office_temperature"
  entity_room3_hum: "sensor.thermostat_current_humidity"
  label_room3: "Home Office"

  entity_room4_temp: "sensor.decent_espresso_de1pro_de1_head_temperature"
  entity_room4_hum: "sensor.thermostat_current_humidity"
  label_room4: "DE1+ Grouphead"

  entity_indoor_co2: "sensor.indoor_co2_ppm"
  entity_indoor_aqi: "sensor.indoor_air_quality_index"
  entity_hvac: "climate.thermostat"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "LilyGo T5 4.7 E-Paper [H716] Touch & LiPo Dashboard for Home Assistant"
  on_boot:
    priority: 250.0
    then:
      - lambda: |-
          auto cause = esp_sleep_get_wakeup_cause();
          if (cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1 || cause == ESP_SLEEP_WAKEUP_GPIO) {
            id(wake_reason_text).publish_state("GPIO21 Wake Button");
            id(is_timer_wake) = false;
            id(is_cold_boot) = false;
            id(last_touch_ms) = millis();
          } else if (cause == ESP_SLEEP_WAKEUP_TIMER) {
            id(wake_reason_text).publish_state("PCF8563 / 15m Timer");
            id(is_timer_wake) = true;
            id(is_cold_boot) = false;
            id(last_touch_ms) = 0;
          } else {
            id(wake_reason_text).publish_state("Cold Boot / USB Reset");
            id(is_timer_wake) = false;
            id(is_cold_boot) = true;
            id(last_touch_ms) = millis();
          }
          id(lipo_voltage).update();
      - delay: 2s
      - script.execute: request_screen_refresh

packages:
  hardware_h716: !include packages/hardware_h716.yaml
  lipo_power_manager: !include packages/lipo_power_manager.yaml
  ha_entities: !include packages/ha_entities.yaml
  touch_navigation: !include packages/touch_navigation.yaml

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG

api:
  id: ha_api
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: esphome_ota
    password: !secret ota_password
    on_begin:
      then:
        - lambda: 'id(ota_in_progress) = true;'
        - logger.log: "OTA Firmware Update Started — locking out Deep Sleep"
        - deep_sleep.prevent: deep_sleep_ctrl
    on_error:
      then:
        - lambda: 'id(ota_in_progress) = false;'

