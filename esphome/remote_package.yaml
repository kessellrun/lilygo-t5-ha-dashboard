        std::string wake = id(wake_reason_text).state;
        if (wake.empty()) wake = "Cold Boot / USB";
        float rssi_val = isnan(id(wifi_rssi).state) ? -58.0f : id(wifi_rssi).state;
        float up_val   = isnan(id(uptime_sec).state) ? (millis() / 1000.0f) : id(uptime_sec).state;
        int q_start    = !isnan(id(ha_quiet_start).state) ? (int)id(ha_quiet_start).state : 23;
        int q_end      = !isnan(id(ha_quiet_end).state)   ? (int)id(ha_quiet_end).state   : 6;

        it.printf(668, 250, id(font_bold_14), COLOR_ON, TextAlign::TOP_LEFT,
                  "State: %s", chg ? "USB-C CHARGING" : "1S LIPO DISCHARGING");
        it.printf(668, 274, id(font_regular_14), COLOR_ON, TextAlign::TOP_LEFT, "Wake: %s", wake.c_str());
        it.printf(668, 298, id(font_regular_14), COLOR_ON, TextAlign::TOP_LEFT,
                  "Wi-Fi: %.0f dBm  •  Up: %.0fs", rssi_val, up_val);
        it.printf(668, 322, id(font_regular_14), COLOR_ON, TextAlign::TOP_LEFT,
                  "Quiet Hours: %02d:00 - %02d:00", q_start, q_end);
        it.printf(668, 346, id(font_regular_14), COLOR_ON, TextAlign::TOP_LEFT,
                  "EPD Refreshes: %d cycles", id(refresh_counter));

        // 4. Bottom-Right Compact Action Buttons (y: 402..464, h: 62)
        draw_card(650, 402, 138, 62, false, 2);
        it.print(719, 412, id(font_bold_14), COLOR_ON, TextAlign::TOP_CENTER, "[ CLEAN ]");
        it.print(719, 434, id(font_regular_14), COLOR_ON, TextAlign::TOP_CENTER, "Anti-Ghosting");

        draw_card(802, 402, 138, 62, false, 2);
        it.print(871, 412, id(font_bold_14), COLOR_ON, TextAlign::TOP_CENTER, "[ SLEEP ]");
        it.print(871, 434, id(font_regular_14), COLOR_ON, TextAlign::TOP_CENTER, "Deep Sleep Now");
      }

      // 4. Bottom 4-Tab Navigation Bar (y: 476..540)
      it.line(0, NAVBAR_Y, SCREEN_W, NAVBAR_Y, COLOR_ON);
