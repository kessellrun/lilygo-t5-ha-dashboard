        // Bottom summary strip inside Left Card (y: 384..452)
        it.line(38, 384, 607, 384, COLOR_ON);
        it.printf(38, 394, id(font_bold_14), COLOR_ON, TextAlign::TOP_LEFT,
                  "Cell: %.2fV  •  SoC: %.0f%%  •  Cutoff: 3.32V  •  Hybrid Shift: <=35%% (3.77V)", vbat, soc);
        it.print(38, 418, id(font_regular_14), COLOR_ON, TextAlign::TOP_LEFT,
                 "Tip: Select '1. ALWAYS ONLINE' when pushing wireless OTA firmware updates.");

        // 3. Main Right Card (x: 650, y: 152, w: 290, h: 240): 1S LiPo Telemetry & Diagnostics
        draw_card(650, 152, 290, 240, false, 2);
        it.print(668, 164, id(font_bold_14), COLOR_ON, TextAlign::TOP_LEFT, "LIPO TELEMETRY (GPIO14)");
