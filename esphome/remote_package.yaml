        for (int m = 0; m < 3; m++) {
          int ry = 218 + m * 50;
          bool is_act = (cur_mode == m);
          it.print(388, ry, id(font_bold_14), COLOR_ON, TextAlign::TOP_LEFT, rows[m].label);
