        }
        it.print(gx - 5, gy - 6, id(font_regular_14), COLOR_ON, TextAlign::TOP_RIGHT, "100%");
        it.print(gx - 5, gy + gh / 2 - 7, id(font_regular_14), COLOR_ON, TextAlign::TOP_RIGHT, "50%");
        it.print(gx - 5, gy + gh - 8, id(font_regular_14), COLOR_ON, TextAlign::TOP_RIGHT, "0%");

        static const float kVoltTicks[4] = {3.30f, 3.60f, 3.90f, 4.20f};
        static const char *kVoltLabels[4] = {"3.3V", "3.6V", "3.9V", "4.2V"};
        for (int t = 0; t < 4; t++) {
          int tx = gx + (int)(((kVoltTicks[t] - 3.30f) / 0.90f) * gw);
          it.line(tx, gy + gh, tx, gy + gh + 4, COLOR_ON);
          it.print(tx, gy + gh + 6, id(font_regular_14), COLOR_ON, TextAlign::TOP_CENTER, kVoltLabels[t]);
        }

        int x_crit = gx + (int)(((3.32f - 3.30f) / 0.90f) * gw);
        int x_hyb  = gx + (int)(((3.77f - 3.30f) / 0.90f) * gw);
        for (int dy = gy + 3; dy < gy + gh - 3; dy += 6) {
          it.line(x_crit, dy, x_crit, dy + 3, COLOR_ON);
          it.line(x_hyb, dy, x_hyb, dy + 3, COLOR_ON);
        }

        struct CurvePt { float v; float s; };
        static const CurvePt kCurve[11] = {
          {3.30f,   0.0f},
          {3.61f,  10.0f},
          {3.70f,  20.0f},
          {3.75f,  30.0f},
          {3.79f,  40.0f},
          {3.82f,  50.0f},
          {3.87f,  60.0f},
          {3.92f,  70.0f},
          {3.98f,  80.0f},
          {4.06f,  90.0f},
          {4.20f, 100.0f}
        };
        for (int i = 0; i < 10; i++) {
          int x0 = gx + (int)(((kCurve[i].v - 3.30f) / 0.90f) * gw);
          int y0 = gy + gh - (int)((kCurve[i].s / 100.0f) * gh);
          int x1 = gx + (int)(((kCurve[i + 1].v - 3.30f) / 0.90f) * gw);
          int y1 = gy + gh - (int)((kCurve[i + 1].s / 100.0f) * gh);
          it.line(x0, y0, x1, y1, COLOR_ON);
          it.line(x0, y0 + 1, x1, y1 + 1, COLOR_ON);
        }

        float v_clamp = (vbat < 3.30f) ? 3.30f : ((vbat > 4.20f) ? 4.20f : vbat);
        float s_clamp = (soc < 0.0f) ? 0.0f : ((soc > 100.0f) ? 100.0f : soc);
        int cur_x = gx + (int)(((v_clamp - 3.30f) / 0.90f) * gw);
        int cur_y = gy + gh - (int)((s_clamp / 100.0f) * gh);
        it.filled_circle(cur_x, cur_y, 5, COLOR_ON);
        it.circle(cur_x, cur_y, 8, COLOR_ON);

        int lbl_y = (cur_y < gy + 24) ? (cur_y + 8) : (cur_y - 20);
        if (cur_x > gx + gw - 115) {
          it.printf(cur_x - 12, lbl_y, id(font_bold_14), COLOR_ON, TextAlign::TOP_RIGHT, "%.2fV (%.0f%%)", vbat, soc);
