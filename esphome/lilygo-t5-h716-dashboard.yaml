# ==============================================================================
# ED047TC1 4.7" 960x540 16-Grayscale Parallel E-Paper Display
# ==============================================================================
display:
  - platform: lilygo_t5_47_plus
    id: epaper_display
    rotation: 0
    update_interval: never
    full_update_every: 10
    lambda: |-
      epd_ui::render_dashboard(it);
